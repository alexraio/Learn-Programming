[project]
name = "taskmaster"
version = "0.1.0"
description = "TaskMaster API - Progetto dimostrativo di sviluppo professionale con FastAPI, SQLAlchemy e CI/CD"
readme = "README.md"
authors = [
    { name = "Alessio Ballarin", email = "ballarin.alessio@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
taskmaster = "taskmaster.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern Python 3.12 syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length gestito dal formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "regression: test di regressione a guardia di bugfix storici",
    "unit: test unitari isolati di dominio",
    "integration: test di integrazione endpoint e database",
]

[tool.coverage.run]
source = ["src/taskmaster"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = [
    "if __name__ == .__main__.:",
    "def main\\(\\)",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

